<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="Isometric architecture: clients (React, Flutter, templates) above a Django core (models, views, DRF), with vision (OpenCV, TensorFlow) and language-model (Claude, OpenAI) services either side, over PostgreSQL as the system of record.">
  <defs>
    <linearGradient id="ig" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#E7EDF7"/><stop offset="100%" stop-color="#F4F7FC"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes pulse { 0%,100% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -26; } }
    .drift { animation: float 7s ease-in-out infinite; }
    .d0 { animation-delay: 0s; }    .d1 { animation-delay: .9s; }
    .d2 { animation-delay: 1.8s; }  .d3 { animation-delay: .45s; }
    .d4 { animation-delay: 1.35s; }
    .beam { animation: pulse 1.6s linear infinite; }
    @media (prefers-reduced-motion: reduce) {
      .drift, .beam { animation: none; }
    }
  </style>

  <rect width="1000" height="470" rx="4" fill="url(#ig)"/>
  <g stroke="#0B5FA5" stroke-width="1" opacity="0.07"><line x1="0" y1="0" x2="1000" y2="0"/><line x1="0" y1="40" x2="1000" y2="40"/><line x1="0" y1="80" x2="1000" y2="80"/><line x1="0" y1="120" x2="1000" y2="120"/><line x1="0" y1="160" x2="1000" y2="160"/><line x1="0" y1="200" x2="1000" y2="200"/><line x1="0" y1="240" x2="1000" y2="240"/><line x1="0" y1="280" x2="1000" y2="280"/><line x1="0" y1="320" x2="1000" y2="320"/><line x1="0" y1="360" x2="1000" y2="360"/><line x1="0" y1="400" x2="1000" y2="400"/><line x1="0" y1="440" x2="1000" y2="440"/><line x1="0" y1="0" x2="0" y2="470"/><line x1="40" y1="0" x2="40" y2="470"/><line x1="80" y1="0" x2="80" y2="470"/><line x1="120" y1="0" x2="120" y2="470"/><line x1="160" y1="0" x2="160" y2="470"/><line x1="200" y1="0" x2="200" y2="470"/><line x1="240" y1="0" x2="240" y2="470"/><line x1="280" y1="0" x2="280" y2="470"/><line x1="320" y1="0" x2="320" y2="470"/><line x1="360" y1="0" x2="360" y2="470"/><line x1="400" y1="0" x2="400" y2="470"/><line x1="440" y1="0" x2="440" y2="470"/><line x1="480" y1="0" x2="480" y2="470"/><line x1="520" y1="0" x2="520" y2="470"/><line x1="560" y1="0" x2="560" y2="470"/><line x1="600" y1="0" x2="600" y2="470"/><line x1="640" y1="0" x2="640" y2="470"/><line x1="680" y1="0" x2="680" y2="470"/><line x1="720" y1="0" x2="720" y2="470"/><line x1="760" y1="0" x2="760" y2="470"/><line x1="800" y1="0" x2="800" y2="470"/><line x1="840" y1="0" x2="840" y2="470"/><line x1="880" y1="0" x2="880" y2="470"/><line x1="920" y1="0" x2="920" y2="470"/><line x1="960" y1="0" x2="960" y2="470"/><line x1="1000" y1="0" x2="1000" y2="470"/></g>
