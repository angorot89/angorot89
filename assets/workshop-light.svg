<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 272" width="1000" height="272" role="img" aria-labelledby="wt wd">
  <title id="wt">The workshop</title>
  <desc id="wd">Tools Amine works with, grouped by backend, vision, language models, and general bench tools.</desc>
  <defs>
    <linearGradient id="wg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F0E3"/><stop offset="100%" stop-color="#EBDCC7"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#7C6647" opacity="0.16"/>
    </pattern>
  </defs>
  <style>
    .chip { fill: #F8F0E3; stroke: #7C664755; stroke-width: 1; }
    .lbl  { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #2B1D12; }
    .grp  { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px;
            fill: #7C6647; letter-spacing: 2.2px; text-transform: uppercase; }
  </style>

  <rect width="1000" height="272" rx="10" fill="url(#wg)"/>
  <rect width="1000" height="272" rx="10" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="999" height="271" rx="10" fill="none" stroke="#7C664755" stroke-width="1"/>

  <text class="grp" x="34" y="60">backend</text>
  <rect x="34" y="44" width="2.5" height="22" rx="1.25" fill="#B96C1B" opacity="0.0"/>
